# Publishes to npm when a version tag is pushed (`npm version patch && git push --follow-tags`).
# Uses npm trusted publishing (OIDC): no npm token is stored; configure the trusted publisher on
# npmjs.com > figma-mcp-v2 > Settings (repository LukasAnda/figma-mcp-v2, workflow release.yml).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with trusted publishing support (11.5.1+)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1; fi
      - run: npm publish --access public
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
